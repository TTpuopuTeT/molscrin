<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Команда — МОЛСКРИН</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #05060d;
    --blue:    #4d7cff;
    --violet:  #a04dff;
    --text:    #e6e8ff;
    --muted:   #9aa0c8;
    --header-h: 86px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html{
    width:100%;
    background:var(--bg);
    overflow-x:hidden;
  }
  body{
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }

  header{
    position:fixed;
    top:0; left:0; right:0;
    height:var(--header-h);
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:22px;
    padding:0 34px;
    background:rgba(8,10,22,.65);
    backdrop-filter:blur(14px) saturate(1.2);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);
    border-bottom:1px solid rgba(120,110,255,.12);
  }

  /* ================= ЛОГОТИП: ТЕКСТОВАЯ «М» ================= */
  .logo{
    display:flex;
    align-items:center;
    text-decoration:none;
    line-height:0;
    flex-shrink:0;
  }
  .logo-letter{
    display:flex;
    align-items:center;
    justify-content:center;
    width:54px;
    height:54px;
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:34px;
    line-height:1;
    letter-spacing:-.02em;
    background:linear-gradient(135deg, #a04dff 0%, #4d7cff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 10px rgba(110,80,255,.55));
    transition:filter .3s ease, transform .3s ease;
    user-select:none;
    -webkit-user-select:none;
  }
  .logo:hover .logo-letter{
    filter:drop-shadow(0 0 18px rgba(150,90,255,.95));
    transform:scale(1.05);
  }

  nav.desktop-nav{
    display:flex;
    align-items:center;
    gap:24px;
  }
  nav.desktop-nav a{
    position:relative;
    color:var(--muted);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    letter-spacing:.04em;
    white-space:nowrap;
    transition:color .2s, text-shadow .2s;
  }
  nav.desktop-nav a::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-6px;
    height:1px;
    background:linear-gradient(90deg, var(--blue), var(--violet));
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .28s ease;
  }
  nav.desktop-nav a:hover{
    color:#fff;
    text-shadow:0 0 14px rgba(150,110,255,.9);
  }
  nav.desktop-nav a:hover::after{ transform:scaleX(1); }
  nav.desktop-nav a.active{ color:#fff; }
  nav.desktop-nav a.active::after{ transform:scaleX(1); }

  .burger{
    display:none;
    width:44px; height:44px;
    background:transparent;
    border:none;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
  }
  .burger span{
    position:absolute;
    left:10px; right:10px;
    height:2px;
    background:var(--text);
    border-radius:2px;
    transition:transform .3s ease, opacity .3s ease, top .3s ease;
  }
  .burger span:nth-child(1){ top:15px; }
  .burger span:nth-child(2){ top:21px; }
  .burger span:nth-child(3){ top:27px; }
  .burger.open span:nth-child(1){ top:21px; transform:rotate(45deg); }
  .burger.open span:nth-child(2){ opacity:0; }
  .burger.open span:nth-child(3){ top:21px; transform:rotate(-45deg); }

  .mobile-menu{
    display:none;
    position:fixed;
    top:var(--header-h);
    left:0; right:0;
    z-index:99;
    background:rgba(8,10,22,.96);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(120,110,255,.18);
    padding:8px 0 16px;
    transform:translateY(-8px);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  .mobile-menu.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .mobile-menu a{
    display:block;
    padding:14px 24px;
    color:var(--muted);
    text-decoration:none;
    font-size:16px;
    font-weight:500;
    letter-spacing:.04em;
    border-bottom:1px solid rgba(120,110,255,.07);
    transition:color .2s, background .2s;
  }
  .mobile-menu a:last-child{ border-bottom:none; }
  .mobile-menu a:active,
  .mobile-menu a.active{
    color:#fff;
    background:rgba(120,80,255,.12);
  }

  /* ================= ФОН: КОЛОННЫ ================= */
  .columns-bg{
    position:fixed;
    inset:0;
    display:flex;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
    z-index:0;
    -webkit-mask-image:linear-gradient(to bottom,
        transparent 0%, #000 16%, #000 84%, transparent 100%);
    mask-image:linear-gradient(to bottom,
        transparent 0%, #000 16%, #000 84%, transparent 100%);
  }

  .column{
    flex:1 1 0;
    overflow:hidden;
    position:relative;
  }

  .column-track{
    display:flex;
    flex-direction:column;
    transform:translate3d(0,0,0);
    animation-name:revolve;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }

  .columns-bg.paused .column-track{
    animation-play-state:paused;
  }

  @keyframes revolve{
    from{ transform:translate3d(0,-50%,0); }
    to  { transform:translate3d(0,0,0);    }
  }

  .column-track span{
    display:block;
    padding:13px 12px;
    font-size:15px;
    font-weight:500;
    line-height:1.35;
    letter-spacing:.01em;
    text-align:center;
    color:rgba(160,170,235,.55);
  }

  .bg-overlay{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 65% 55% at 50% 45%,
        rgba(5,6,13,.35) 0%,
        rgba(5,6,13,.65) 55%,
        rgba(5,6,13,.9) 100%),
      linear-gradient(to bottom,
        rgba(5,6,13,.85) 0%,
        rgba(5,6,13,.2) 25%,
        rgba(5,6,13,.2) 75%,
        rgba(5,6,13,.9) 100%);
  }

  /* ================= КОНТЕНТ ================= */
  .page{
    position:relative;
    z-index:2;
    min-height:100vh;
    padding-top:var(--header-h);
  }

  .page-inner{
    max-width:1080px;
    margin:0 auto;
    padding:56px 34px 100px;
  }

  /* ================= ПОИСК ================= */
  .team-search{
    position:relative;
    display:flex;
    align-items:center;
    width:100%;
    max-width:420px;
    height:48px;
    margin-bottom:22px;
    padding:0 42px 0 16px;
    border-radius:24px;
    background:rgba(20,22,45,.85);
    border:1px solid rgba(140,110,255,.35);
    box-shadow:0 0 22px rgba(90,60,255,.15);
    transition:border-color .2s, box-shadow .2s;
  }
  .team-search:focus-within{
    border-color:rgba(170,130,255,.85);
    box-shadow:0 0 28px rgba(120,80,255,.32);
  }
  .team-search svg{
    width:16px; height:16px;
    stroke:rgba(200,205,255,.75);
    stroke-width:2;
    fill:none;
    stroke-linecap:round;
    flex-shrink:0;
    margin-right:10px;
  }
  .team-search input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    letter-spacing:.01em;
  }
  .team-search input::placeholder{
    color:rgba(154,160,200,.7);
  }
  .team-search .clear{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:30px; height:30px;
    border-radius:50%;
    background:transparent;
    border:none;
    color:rgba(200,205,255,.7);
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:16px;
    line-height:1;
    transition:background .2s, color .2s;
  }
  .team-search .clear:hover{
    background:rgba(120,80,255,.25);
    color:#fff;
  }
  .team-search.has-value .clear{ display:flex; }

  /* ================= ЗАГОЛОВОК ================= */
  .page-title{
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:clamp(30px, 4.2vw, 48px);
    letter-spacing:.02em;
    line-height:1.1;
    margin-bottom:38px;
    background:linear-gradient(180deg,
      #ffffff 0%,
      #c3cbff 55%,
      #7a5cff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 24px rgba(90,70,255,.45));
  }

  /* ================= СПИСКИ ================= */
  .team-list{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .team-list-founders{
    margin-bottom:44px;
  }

  /* ================= КАРТОЧКИ ================= */
  .team-card{
    display:flex;
    gap:24px;
    align-items:center;
    padding:22px;
    background:rgba(20,22,45,.08);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    border:1px solid rgba(120,110,255,.14);
    border-radius:20px;
    text-decoration:none;
    color:inherit;
    transition:transform .4s cubic-bezier(.2,.7,.3,1),
               background .4s,
               border-color .4s,
               box-shadow .4s;
    opacity:0;
    transform:translateY(24px);
    position:relative;
    overflow:hidden;
  }
  .team-card.visible{
    opacity:1;
    transform:translateY(0);
  }
  .team-card:hover{
    background:rgba(60,40,120,.22);
    border-color:rgba(170,130,255,.85);
    box-shadow:
      0 24px 70px rgba(90,60,255,.4),
      0 0 50px rgba(140,90,255,.32),
      inset 0 1px 0 rgba(255,255,255,.08);
    transform:translateY(-5px);
  }

  .team-card.founder{
    padding:28px;
    border-color:rgba(160,110,255,.35);
    background:
      linear-gradient(135deg, rgba(80,50,180,.18) 0%, rgba(30,20,60,.12) 100%);
    box-shadow:
      0 0 0 1px rgba(160,110,255,.1),
      0 12px 40px rgba(90,60,255,.15);
  }
  .team-card.founder::before{
    content:'';
    position:absolute;
    top:0; left:0;
    width:4px;
    height:100%;
    background:linear-gradient(180deg, var(--violet), var(--blue));
    opacity:.85;
  }
  .team-card.founder:hover{
    border-color:rgba(200,160,255,.9);
    background:
      linear-gradient(135deg, rgba(100,60,220,.28) 0%, rgba(40,25,80,.2) 100%);
    box-shadow:
      0 0 0 1px rgba(200,160,255,.3),
      0 28px 80px rgba(90,60,255,.5),
      0 0 60px rgba(160,100,255,.4);
  }
  .team-card.founder .team-photo{
    width:160px;
    height:160px;
    border-radius:18px;
    border-color:rgba(160,120,255,.45);
  }
  .team-card.founder .team-name{
    font-size:clamp(22px, 2.6vw, 28px);
  }
  .team-card.founder .team-role{
    font-size:13px;
    letter-spacing:.12em;
    color:#c3b0ff;
  }

  /* ================= ФОТО ================= */
  .team-photo{
    width:140px;
    height:140px;
    border-radius:16px;
    flex-shrink:0;
    overflow:hidden;
    background:
      linear-gradient(135deg, rgba(60,40,120,.3), rgba(20,22,45,.5)),
      radial-gradient(circle at 30% 30%, rgba(120,80,255,.15), transparent 60%);
    border:1px solid rgba(120,110,255,.22);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:border-color .4s, box-shadow .4s;
  }
  .team-card:hover .team-photo{
    border-color:rgba(170,130,255,.8);
    box-shadow:0 0 32px rgba(140,90,255,.5);
  }
  .team-photo img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .team-photo .soon{
    font-size:11px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(180,170,255,.55);
    border:1px solid rgba(120,110,255,.3);
    padding:6px 12px;
    border-radius:20px;
  }

  /* ================= ИНФО ================= */
  .team-info{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
    flex:1;
  }
  .team-name{
    font-family:'Unbounded',sans-serif;
    font-weight:600;
    font-size:clamp(18px, 2vw, 22px);
    letter-spacing:.01em;
    line-height:1.25;
    background:linear-gradient(180deg, #ffffff 0%, #c3cbff 60%, #9c7dff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .team-role{
    font-size:14px;
    color:#a99bff;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.9;
  }
  .team-bio{
    margin-top:6px;
    font-size:14px;
    line-height:1.6;
    color:var(--muted);
  }

  /* ================= НИЧЕГО НЕ НАЙДЕНО ================= */
  .team-empty{
    display:none;
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:15px;
    letter-spacing:.02em;
  }
  .team-empty.show{ display:block; }

  /* ================= ПЛАНШЕТ ================= */
  @media (max-width:1100px){
    header{ padding:0 20px; gap:16px; }
    nav.desktop-nav{ gap:16px; }
    nav.desktop-nav a{ font-size:14px; }
    .logo-letter{ width:46px; height:46px; font-size:29px; }
    .page-inner{ padding:42px 22px 90px; }
    .team-photo{ width:120px; height:120px; }
    .team-card.founder .team-photo{ width:140px; height:140px; }
  }

  /* ================= МОБИЛЬНЫЙ ================= */
  @media (max-width:900px){
    :root{ --header-h: 66px; }
    header{ padding:0 14px; gap:12px; }
    nav.desktop-nav{ display:none; }
    .burger{ display:block; }
    .mobile-menu{ display:block; }
    .logo-letter{ width:40px; height:40px; font-size:25px; }

    .page-inner{ padding:34px 16px 72px; }
    .page-title{ margin-bottom:26px; }

    .column-track span{
      font-size:13px;
      padding:11px 6px;
      line-height:1.3;
    }

    .team-card{
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      background:rgba(20,22,45,.55);
      gap:18px;
      padding:18px;
    }
    .team-card.founder{
      padding:22px;
    }
    .team-photo{ width:100px; height:100px; border-radius:12px; }
    .team-card.founder .team-photo{ width:120px; height:120px; }
    .team-name{ font-size:16px; }
    .team-card.founder .team-name{ font-size:18px; }
    .team-role{ font-size:12px; }
    .team-card.founder .team-role{ font-size:11px; }
    .team-bio{ font-size:13px; }

    .team-list-founders{ margin-bottom:34px; }

    .team-search{
      height:46px;
      max-width:100%;
      margin-bottom:18px;
    }
  }

  /* ================= УЗКИЙ ТЕЛЕФОН ================= */
  @media (max-width:520px){
    :root{ --header-h: 60px; }
    header{ padding:0 12px; gap:10px; }
    .logo-letter{ width:36px; height:36px; font-size:22px; }

    .page-inner{ padding:26px 12px 60px; }

    .column-track span{
      font-size:12px;
      padding:10px 4px;
    }

    .team-card{
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:14px;
      padding:22px 18px;
    }
    .team-card.founder{
      padding:26px 20px;
    }
    .team-photo{ width:120px; height:120px; }
    .team-card.founder .team-photo{ width:140px; height:140px; }

    .burger{ width:40px; height:40px; }
    .burger span{ left:9px; right:9px; }
    .burger span:nth-child(1){ top:13px; }
    .burger span:nth-child(2){ top:19px; }
    .burger span:nth-child(3){ top:25px; }
    .burger.open span:nth-child(1),
    .burger.open span:nth-child(3){ top:19px; }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<header>

  <!-- ============ ТЕКСТОВАЯ «М» ============ -->
  <a href="index.html" class="logo" aria-label="МОЛСКРИН">
    <span class="logo-letter">М</span>
  </a>

  <nav class="desktop-nav">
    <a href="index.html">Главная</a>
    <a href="watch.html">Смотреть</a>
    <a href="team.html" class="active">Команда</a>
    <a href="announcements.html">Анонсы</a>
    <a href="biography.html">Биография</a>
  </nav>

  <button class="burger" id="burger" aria-label="Меню" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Главная</a>
  <a href="watch.html">Смотреть</a>
  <a href="team.html" class="active">Команда</a>
  <a href="announcements.html">Анонсы</a>
  <a href="biography.html">Биография</a>
</div>

<div class="columns-bg" id="columns"></div>
<div class="bg-overlay"></div>

<div class="page">
  <div class="page-inner">

    <!-- ============ ПОИСК (над заголовком) ============ -->
    <div class="team-search" id="teamSearch">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
      <input type="text" id="teamSearchInput" placeholder="Поиск по команде…" autocomplete="off" spellcheck="false">
      <button class="clear" id="teamSearchClear" aria-label="Очистить" type="button">✕</button>
    </div>

    <h1 class="page-title">Команда</h1>

    <div class="team-list team-list-founders" id="foundersList"></div>
    <div class="team-list" id="teamList"></div>
    <div class="team-empty" id="teamEmpty">Ничего не найдено</div>

  </div>
</div>

<script>
  /* ==================================================================
     СПИСОК НАЗВАНИЙ ДЛЯ ФОНА
     ================================================================== */
  const TITLES = [
    'Раскол','Северный ветер','Весна','Элли','Изумрудный город','Я больше не буду плакать',
    'Красный кролик','Красный кролик: Первая жертва','Красный кролик: Грехи',
    'Красный кролик: Искупление','Око за око','Нашедший','Нашедший: Принятие',
    'Наказание','Первый ход','Scappa de casa','Не улетай','Пыль','Помощь',
    'Любовь','Страницы усталости','Mors certa, vita incerta','Последний глоток'
  ];

  const columnsEl = document.getElementById('columns');

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function columnCount(){
    const w = window.innerWidth;
    const weak = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
                 (navigator.deviceMemory && navigator.deviceMemory <= 4);
    if (w < 480)  return 2;
    if (w < 700)  return weak ? 2 : 3;
    if (w < 1100) return weak ? 3 : 4;
    if (w < 1600) return weak ? 4 : 5;
    return weak ? 4 : 6;
  }

  const TITLES_PER_COLUMN = 12;
  let currentColumnCount = 0;

  function buildColumns(){
    const count = columnCount();
    currentColumnCount = count;
    columnsEl.innerHTML = '';
    for(let i = 0; i < count; i++){
      const col   = document.createElement('div');
      col.className = 'column';
      const track = document.createElement('div');
      track.className = 'column-track';
      const seq = shuffle([...TITLES]).slice(0, TITLES_PER_COLUMN);
      seq.concat(seq).forEach(title => {
        const s = document.createElement('span');
        s.textContent = title;
        track.appendChild(s);
      });
      const dur = 28 + Math.random() * 24;
      track.style.animationDuration = dur + 's';
      track.style.animationDelay    = (-Math.random() * dur) + 's';
      col.appendChild(track);
      columnsEl.appendChild(col);
    }
  }
  buildColumns();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if(columnCount() !== currentColumnCount){
        buildColumns();
      }
    }, 250);
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if(columnCount() !== currentColumnCount){
        buildColumns();
      }
    }, 300);
  });

  document.addEventListener('visibilitychange', () => {
    columnsEl.classList.toggle('paused', document.hidden);
  });

  /* ==================================================================
     ДАННЫЕ КОМАНДЫ
     ================================================================== */
  const FOUNDERS = [
    {
      name:  'Иван Товстокорый',
      role:  'Режиссёр · Актёр · Сценарист',
      bio:   '',
      photo: 'team/Ivan_Tovstokory/Ivan_Tovstokory.JPG',
      link:  'team/Ivan_Tovstokory/Ivan_Tovstokory.html'
    },
    {
      name:  'Вячеслав Гущин',
      role:  'Актёр · Оператор · Второй режиссёр',
      bio:   '',
      photo: 'team/Vyacheslav_Gushchin/Vyacheslav_Gushchin.JPG',
      link:  'team/Vyacheslav_Gushchin/Vyacheslav_Gushchin.html'
    }
  ];

  const TEAM = [
    { name: 'Полина Рассказова', role: 'Актриса · Помощник режиссёра', bio: '', photo: 'team/Polina_Rasskazova/Polina_Rasskazova.JPG', link: 'team/Polina_Rasskazova/Polina_Rasskazova.html' },
    { name: 'Тимофей Семенов', role: 'Главный веб-разработчик', bio: '', photo: 'team/Timofey_Semenov/Timofey_Semenov.JPG', link: 'team/Timofey_Semenov/Timofey_Semenov.html' },
    { name: 'Таисия Мартынюк', role: 'Актриса', bio: '', photo: 'team/Taisia_Martynyuk/Taisia_Martynyuk.JPG', link: 'team/Taisia_Martynyuk/Taisia_Martynyuk.html' },
    { name: 'Ренат Фаухиев', role: 'Актёр', bio: '', photo: 'team/Renat_Faukhiev/Renat_Faukhiev.JPG', link: 'team/Renat_Faukhiev/Renat_Faukhiev.html' },
    { name: 'Торун Аморян', role: 'Актёр', bio: '', photo: 'team/Torun_Amoryan/Torun_Amoryan.JPG', link: 'team/Torun_Amoryan/Torun_Amoryan.html' },
    { name: 'Александра Ионова', role: 'Актриса', bio: '', photo: 'team/Alexandra_Ionova/Alexandra_Ionova.JPG', link: 'team/Alexandra_Ionova/Alexandra_Ionova.html' },
    { name: 'Александра Кузьмина', role: 'Актриса', bio: '', photo: 'team/Alexandra_Kuzmina/Alexandra_Kuzmina.JPG', link: 'team/Alexandra_Kuzmina/Alexandra_Kuzmina.html' },
    { name: 'Дарья Шарафеева', role: 'Актриса', bio: '', photo: 'team/Daria_Sharafeeva/Daria_Sharafeeva.JPG', link: 'team/Daria_Sharafeeva/Daria_Sharafeeva.html' },
    { name: 'Ярослав Елфимов', role: 'Актёр', bio: '', photo: 'team/Yaroslav_Elfimov/Yaroslav_Elfimov.JPG', link: 'team/Yaroslav_Elfimov/Yaroslav_Elfimov.html' },
    { name: 'Георгий Плотников', role: 'Актёр', bio: '', photo: 'team/Georgy_Plotnikov/Georgy_Plotnikov.JPG', link: 'team/Georgy_Plotnikov/Georgy_Plotnikov.html' },

    { name: 'Дарья Сальникова', role: 'Актриса', bio: '', photo: 'team/Daria_Salnikova/Daria_Salnikova.JPG', link: 'team/Daria_Salnikova/Daria_Salnikova.html' },
    { name: 'Сергей Зыков', role: 'Актёр', bio: '', photo: 'team/Sergey_Zykov/Sergey_Zykov.JPG', link: 'team/Sergey_Zykov/Sergey_Zykov.html' },
    { name: 'Мария Борисовна', role: 'Актриса', bio: '', photo: 'team/Maria_Borisovna/Maria_Borisovna.JPG', link: 'team/Maria_Borisovna/Maria_Borisovna.html' },
    { name: 'Андрей Жигулин', role: 'Актёр', bio: '', photo: 'team/Andrey_Zhigulin/Andrey_Zhigulin.JPG', link: 'team/Andrey_Zhigulin/Andrey_Zhigulin.html' },
    { name: 'Иван Колот', role: 'Актёр', bio: '', photo: 'team/Ivan_Kolot/Ivan_Kolot.JPG', link: 'team/Ivan_Kolot/Ivan_Kolot.html' }
  ];

  /* ==================================================================
     РЕНДЕР КАРТОЧЕК
     ================================================================== */
  const foundersList = document.getElementById('foundersList');
  const teamList     = document.getElementById('teamList');
  const teamEmpty    = document.getElementById('teamEmpty');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function renderPerson(person, isFounder){
    const roleHtml = person.role
      ? `<div class="team-role">${escapeHtml(person.role)}</div>`
      : '';

    const bioHtml = person.bio
      ? `<p class="team-bio">${escapeHtml(person.bio)}</p>`
      : '';

    const photoHtml = person.photo
      ? `<div class="team-photo">
           <img src="${person.photo}" alt="${escapeHtml(person.name)}"
                width="140" height="140"
                loading="lazy" decoding="async"
                onerror="this.style.display='none'; this.parentNode.insertAdjacentHTML('beforeend','<span class=&quot;soon&quot;>Скоро</span>')">
         </div>`
      : `<div class="team-photo"><span class="soon">Скоро</span></div>`;

    const nameTag = isFounder ? 'h2' : 'h3';

    const inner = `
      ${photoHtml}
      <div class="team-info">
        <${nameTag} class="team-name">${escapeHtml(person.name)}</${nameTag}>
        ${roleHtml}
        ${bioHtml}
      </div>
    `;

    const cls = isFounder ? 'team-card founder' : 'team-card';

    return person.link
      ? `<a class="${cls}" href="${person.link}">${inner}</a>`
      : `<div class="${cls}">${inner}</div>`;
  }

  /* ==================================================================
     ПОИСК ПО ИМЕНИ И ФАМИЛИИ
     ================================================================== */
  function normalize(s){
    return String(s).toLowerCase().replace(/ё/g, 'е');
  }

  const searchWrap  = document.getElementById('teamSearch');
  const searchInput = document.getElementById('teamSearchInput');
  const searchClear = document.getElementById('teamSearchClear');

  let currentQuery = '';

  function matchesQuery(person){
    if(!currentQuery) return true;
    return normalize(person.name).includes(currentQuery);
  }

  function renderTeam(){
    const founders = FOUNDERS.filter(matchesQuery);
    const members  = TEAM.filter(matchesQuery);

    foundersList.innerHTML = founders.map(p => renderPerson(p, true)).join('');
    teamList.innerHTML     = members.map(p => renderPerson(p, false)).join('');

    const any = founders.length + members.length > 0;
    teamEmpty.classList.toggle('show', !any);

    const cards = document.querySelectorAll('.team-card');
    if('IntersectionObserver' in window){
      const io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if(en.isIntersecting){
            en.target.classList.add('visible');
            io.unobserve(en.target);
          }
        });
      }, { threshold:0.12, rootMargin:'0px 0px -40px 0px' });
      cards.forEach((el, i) => {
        el.style.transitionDelay = ((i % 6) * 60) + 'ms';
        io.observe(el);
      });
    } else {
      cards.forEach(el => el.classList.add('visible'));
    }
  }

  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    const val = searchInput.value;
    searchWrap.classList.toggle('has-value', val.length > 0);

    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      currentQuery = normalize(val.trim());
      renderTeam();
    }, 120);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchWrap.classList.remove('has-value');
    currentQuery = '';
    renderTeam();
    searchInput.focus();
  });

  searchInput.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if(searchInput.value){
        searchInput.value = '';
        searchWrap.classList.remove('has-value');
        currentQuery = '';
        renderTeam();
      }
    }
  });

  renderTeam();

  /* ==================================================================
     БУРГЕР
     ================================================================== */
  const burger     = document.getElementById('burger');
  const mobileMenu = document.getElementById('mobileMenu');

  burger.addEventListener('click', () => {
    const open = burger.classList.toggle('open');
    mobileMenu.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      burger.classList.remove('open');
      mobileMenu.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    });
  });
</script>
