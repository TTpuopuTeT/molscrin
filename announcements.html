<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Анонсы — МОЛСКРИН</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #05060d;
    --blue:    #4d7cff;
    --violet:  #a04dff;
    --text:    #e6e8ff;
    --muted:   #9aa0c8;
    --header-h: 86px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html{
    width:100%;
    background:var(--bg);
    overflow-x:hidden;
  }
  body{
    width:100%;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }

  /* ================= ШАПКА ================= */
  header{
    position:fixed;
    top:0; left:0; right:0;
    height:var(--header-h);
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:22px;
    padding:0 34px;
    background:rgba(8,10,22,.65);
    backdrop-filter:blur(14px) saturate(1.2);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);
    border-bottom:1px solid rgba(120,110,255,.12);
  }

  /* ================= ЛОГОТИП: ТЕКСТОВАЯ «М» ================= */
  .logo{
    display:flex;
    align-items:center;
    text-decoration:none;
    line-height:0;
    flex-shrink:0;
  }
  .logo-letter{
    display:flex;
    align-items:center;
    justify-content:center;
    width:54px;
    height:54px;
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:34px;
    line-height:1;
    letter-spacing:-.02em;
    background:linear-gradient(135deg, #a04dff 0%, #4d7cff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 10px rgba(110,80,255,.55));
    transition:filter .3s ease, transform .3s ease;
    user-select:none;
    -webkit-user-select:none;
  }
  .logo:hover .logo-letter{
    filter:drop-shadow(0 0 18px rgba(150,90,255,.95));
    transform:scale(1.05);
  }

  nav.desktop-nav{
    display:flex;
    align-items:center;
    gap:24px;
  }
  nav.desktop-nav a{
    position:relative;
    color:var(--muted);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    letter-spacing:.04em;
    white-space:nowrap;
    transition:color .2s, text-shadow .2s;
  }
  nav.desktop-nav a::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-6px;
    height:1px;
    background:linear-gradient(90deg, var(--blue), var(--violet));
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .28s ease;
  }
  nav.desktop-nav a:hover{
    color:#fff;
    text-shadow:0 0 14px rgba(150,110,255,.9);
  }
  nav.desktop-nav a:hover::after{ transform:scaleX(1); }
  nav.desktop-nav a.active{ color:#fff; }
  nav.desktop-nav a.active::after{ transform:scaleX(1); }

  .burger{
    display:none;
    width:44px; height:44px;
    background:transparent;
    border:none;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
  }
  .burger span{
    position:absolute;
    left:10px; right:10px;
    height:2px;
    background:var(--text);
    border-radius:2px;
    transition:transform .3s ease, opacity .3s ease, top .3s ease;
  }
  .burger span:nth-child(1){ top:15px; }
  .burger span:nth-child(2){ top:21px; }
  .burger span:nth-child(3){ top:27px; }
  .burger.open span:nth-child(1){ top:21px; transform:rotate(45deg); }
  .burger.open span:nth-child(2){ opacity:0; }
  .burger.open span:nth-child(3){ top:21px; transform:rotate(-45deg); }

  .mobile-menu{
    display:none;
    position:fixed;
    top:var(--header-h);
    left:0; right:0;
    z-index:99;
    background:rgba(8,10,22,.96);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(120,110,255,.18);
    padding:8px 0 16px;
    transform:translateY(-8px);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  .mobile-menu.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .mobile-menu a{
    display:block;
    padding:14px 24px;
    color:var(--muted);
    text-decoration:none;
    font-size:16px;
    font-weight:500;
    letter-spacing:.04em;
    border-bottom:1px solid rgba(120,110,255,.07);
    transition:color .2s, background .2s;
  }
  .mobile-menu a:last-child{ border-bottom:none; }
  .mobile-menu a:active,
  .mobile-menu a.active{
    color:#fff;
    background:rgba(120,80,255,.12);
  }

  /* ================= ФОН: ЧУТЬ УСИЛЕННОЕ СВЕЧЕНИЕ ================= */
  .bg-glow{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%,
        rgba(120,60,220,.24) 0%,
        transparent 60%),
      radial-gradient(ellipse 50% 50% at 85% 80%,
        rgba(60,90,220,.22) 0%,
        transparent 65%);
  }

  /* ================= КОНТЕЙНЕР ================= */
  .page{
    position:relative;
    z-index:2;
    padding-top:var(--header-h);
    min-height:100vh;
  }
  .page-inner{
    max-width:1280px;
    margin:0 auto;
    padding:56px 34px 100px;
  }

  .page-header{ margin-bottom:44px; }

  .page-title{
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:clamp(30px, 4.2vw, 48px);
    letter-spacing:.02em;
    line-height:1.1;
    margin-bottom:14px;
    background:linear-gradient(180deg,
      #ffffff 0%,
      #c3cbff 55%,
      #7a5cff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 24px rgba(90,70,255,.45));
  }

  /* ================= КРАСИВОЕ ПУСТОЕ СОСТОЯНИЕ ================= */
  .empty-state{
    position:relative;
    max-width:640px;
    margin:40px auto 0;
    padding:56px 40px;
    text-align:center;
    border-radius:28px;
    background:
      linear-gradient(135deg,
        rgba(60,40,120,.16) 0%,
        rgba(20,22,45,.5) 50%,
        rgba(60,90,220,.12) 100%);
    border:1px solid rgba(120,110,255,.22);
    box-shadow:
      0 24px 70px rgba(0,0,0,.4),
      0 0 60px rgba(90,60,255,.18),
      inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;

    /* плавное быстрое появление */
    opacity:0;
    transform:translateY(10px);
    animation:emptyIn .35s cubic-bezier(.2,.7,.3,1) .05s forwards;
  }
  @keyframes emptyIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .empty-state::before{
    content:'';
    position:absolute;
    top:-50%; left:-50%;
    width:200%; height:200%;
    background:conic-gradient(from 0deg,
      transparent 0%,
      rgba(160,90,255,.08) 25%,
      transparent 50%,
      rgba(80,120,255,.08) 75%,
      transparent 100%);
    animation:emptySpin 18s linear infinite;
    pointer-events:none;
  }
  @keyframes emptySpin{
    to{ transform:rotate(360deg); }
  }

  .empty-state > *{ position:relative; z-index:1; }

  .empty-icon{
    width:72px; height:72px;
    margin:0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:
      linear-gradient(135deg, rgba(160,90,255,.22), rgba(80,120,255,.22));
    border:1px solid rgba(160,120,255,.4);
    box-shadow:
      0 0 30px rgba(140,90,255,.35),
      inset 0 1px 0 rgba(255,255,255,.1);
    /* лёгкое мерцание */
    animation:iconGlow 3s ease-in-out infinite;
  }
  @keyframes iconGlow{
    0%,100%{ transform:scale(1);    }
    50%    { transform:scale(1.04); }
  }
  .empty-icon svg{
    width:32px; height:32px;
    stroke:url(#emptyGrad);
    stroke-width:1.8;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .empty-title{
    font-family:'Unbounded',sans-serif;
    font-weight:600;
    font-size:clamp(20px, 2.4vw, 26px);
    letter-spacing:.01em;
    line-height:1.25;
    margin-bottom:12px;
    background:linear-gradient(180deg, #ffffff 0%, #c3cbff 60%, #9c7dff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .empty-text{
    font-size:15px;
    line-height:1.6;
    color:var(--muted);
    max-width:460px;
    margin:0 auto;
  }

  .empty-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:26px;
    padding:12px 24px;
    border-radius:24px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg, var(--violet), var(--blue));
    background-size:180% 180%;
    box-shadow:
      0 10px 28px rgba(120,80,255,.4),
      inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .3s;
  }
  .empty-link:hover{
    transform:translateY(-3px);
    box-shadow:
      0 16px 40px rgba(140,90,255,.6),
      inset 0 1px 0 rgba(255,255,255,.3);
  }
  .empty-link svg{
    width:14px; height:14px;
    stroke:#fff;
    stroke-width:2.2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .25s;
  }
  .empty-link:hover svg{ transform:translateX(3px); }

  /* ================= ПЛАНШЕТ ================= */
  @media (max-width:1100px){
    header{ padding:0 20px; gap:16px; }
    nav.desktop-nav{ gap:16px; }
    nav.desktop-nav a{ font-size:14px; }
    .logo-letter{ width:46px; height:46px; font-size:29px; }
    .page-inner{ padding:42px 22px 90px; }
  }

  /* ================= МОБИЛЬНЫЙ ================= */
  @media (max-width:900px){
    :root{ --header-h: 66px; }
    header{ padding:0 14px; gap:12px; }
    nav.desktop-nav{ display:none; }
    .burger{ display:block; }
    .mobile-menu{ display:block; }
    .logo-letter{ width:40px; height:40px; font-size:25px; }

    .page-inner{ padding:34px 16px 72px; }
    .page-title{ margin-bottom:10px; }

    .empty-state{
      padding:44px 28px;
      border-radius:22px;
      margin-top:28px;
    }
    .empty-icon{ width:62px; height:62px; margin-bottom:18px; }
    .empty-icon svg{ width:28px; height:28px; }
    .empty-text{ font-size:14px; }
    .empty-link{
      padding:11px 20px;
      font-size:13px;
      margin-top:22px;
    }
  }

  /* ================= УЗКИЙ ТЕЛЕФОН ================= */
  @media (max-width:520px){
    :root{ --header-h: 60px; }
    header{ padding:0 12px; gap:10px; }
    .logo-letter{ width:36px; height:36px; font-size:22px; }
    .page-inner{ padding:26px 12px 60px; }

    .burger{ width:40px; height:40px; }
    .burger span{ left:9px; right:9px; }
    .burger span:nth-child(1){ top:13px; }
    .burger span:nth-child(2){ top:19px; }
    .burger span:nth-child(3){ top:25px; }
    .burger.open span:nth-child(1),
    .burger.open span:nth-child(3){ top:19px; }

    .empty-state{
      padding:36px 22px;
      border-radius:20px;
    }
    .empty-icon{ width:54px; height:54px; }
    .empty-icon svg{ width:24px; height:24px; }
    .empty-title{ font-size:18px; }
    .empty-text{ font-size:13px; }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<header>

  <!-- ============ ТЕКСТОВАЯ «М» ============ -->
  <a href="index.html" class="logo" aria-label="МОЛСКРИН">
    <span class="logo-letter">М</span>
  </a>

  <nav class="desktop-nav">
    <a href="index.html">Главная</a>
    <a href="watch.html">Смотреть</a>
    <a href="team.html">Команда</a>
    <a href="announcements.html" class="active">Анонсы</a>
    <a href="biography.html">Биография</a>
  </nav>

  <button class="burger" id="burger" aria-label="Меню" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Главная</a>
  <a href="watch.html">Смотреть</a>
  <a href="team.html">Команда</a>
  <a href="announcements.html" class="active">Анонсы</a>
  <a href="biography.html">Биография</a>
</div>

<!-- ФОН -->
<div class="bg-glow"></div>

<div class="page">
  <div class="page-inner">

    <div class="page-header">
      <h1 class="page-title">Анонсы</h1>
    </div>

    <!-- ============ КРАСИВОЕ ПУСТОЕ СОСТОЯНИЕ ============ -->
    <div class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="emptyGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#a04dff"/>
              <stop offset="100%" stop-color="#4d7cff"/>
            </linearGradient>
          </defs>
          <!-- колокольчик -->
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </div>

      <h2 class="empty-title">Скоро здесь появятся анонсы новых фильмов</h2>
      <p class="empty-text">
        Мы готовим новые фильмы. Как только анонсируем новый фильм,
        он появится здесь. Следите за обновлениями
      </p>

      <a href="watch.html" class="empty-link">
        Смотреть фильмы
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="13 6 19 12 13 18"/>
        </svg>
      </a>
    </div>

  </div>
</div>

<script>
  /* ==================================================================
     БУРГЕР
     ================================================================== */
  const burger     = document.getElementById('burger');
  const mobileMenu = document.getElementById('mobileMenu');

  burger.addEventListener('click', () => {
    const open = burger.classList.toggle('open');
    mobileMenu.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      burger.classList.remove('open');
      mobileMenu.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    });
  });
</script>

</body>
</html>
