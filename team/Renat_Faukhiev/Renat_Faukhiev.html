<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Ренат Фаухиев — МОЛСКРИН</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #05060d;
    --blue:    #4d7cff;
    --violet:  #a04dff;
    --text:    #e6e8ff;
    --muted:   #9aa0c8;
    --header-h: 86px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html{
    width:100%;
    background:var(--bg);
    overflow-x:hidden;
    scroll-behavior:smooth;
  }
  body{
    width:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }

  header{
    position:fixed;
    top:0; left:0; right:0;
    height:var(--header-h);
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:22px;
    padding:0 34px;
    background:rgba(8,10,22,.5);
    backdrop-filter:blur(16px) saturate(1.2);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    border-bottom:1px solid rgba(120,110,255,.12);
    transition:background .3s ease, border-color .3s ease;
  }
  header.scrolled{
    background:rgba(6,8,18,.85);
    border-bottom-color:rgba(120,110,255,.25);
  }
  header::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(160,80,255,.6) 25%,
      rgba(80,120,255,.6) 75%,
      transparent 100%);
    background-size:200% 100%;
    animation:headerFlow 8s linear infinite;
    opacity:.7;
  }
  @keyframes headerFlow{
    from{ background-position:0% 0; }
    to  { background-position:200% 0; }
  }

  .close-btn{
    width:44px; height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:var(--text);
    text-decoration:none;
    flex-shrink:0;
    transition:background .3s, transform .4s cubic-bezier(.2,.7,.3,1), color .3s, box-shadow .3s;
  }
  .close-btn svg{
    width:22px; height:22px;
    stroke:currentColor;
    stroke-width:2.2;
    stroke-linecap:round;
  }
  .close-btn:hover,
  .close-btn:active{
    background:rgba(120,80,255,.22);
    color:#fff;
    transform:rotate(90deg);
    box-shadow:0 0 22px rgba(140,90,255,.5);
  }

  .header-title{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    font-family:'Unbounded',sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:.04em;
    color:#fff;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
    text-shadow:0 0 20px rgba(120,80,255,.6);
  }
  header.scrolled .header-title{
    opacity:1;
  }

  nav.desktop-nav{
    display:flex;
    align-items:center;
    gap:24px;
  }
  nav.desktop-nav a{
    position:relative;
    color:var(--muted);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    letter-spacing:.04em;
    white-space:nowrap;
    transition:color .25s, text-shadow .25s, transform .25s;
  }
  nav.desktop-nav a::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-6px;
    height:1px;
    background:linear-gradient(90deg, var(--blue), var(--violet));
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  nav.desktop-nav a:hover{
    color:#fff;
    text-shadow:0 0 16px rgba(150,110,255,.9);
    transform:translateY(-1px);
  }
  nav.desktop-nav a:hover::after{ transform:scaleX(1); }

  .burger{
    display:none;
    width:44px; height:44px;
    background:transparent;
    border:none;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
  }
  .burger span{
    position:absolute;
    left:10px; right:10px;
    height:2px;
    background:var(--text);
    border-radius:2px;
    transition:transform .35s cubic-bezier(.2,.7,.3,1), opacity .3s, top .3s;
  }
  .burger span:nth-child(1){ top:15px; }
  .burger span:nth-child(2){ top:21px; }
  .burger span:nth-child(3){ top:27px; }
  .burger.open span:nth-child(1){ top:21px; transform:rotate(45deg); }
  .burger.open span:nth-child(2){ opacity:0; }
  .burger.open span:nth-child(3){ top:21px; transform:rotate(-45deg); }

  .mobile-menu{
    display:none;
    position:fixed;
    top:var(--header-h);
    left:0; right:0;
    z-index:99;
    background:rgba(8,10,22,.96);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(120,110,255,.18);
    padding:8px 0 16px;
    transform:translateY(-8px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  .mobile-menu.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .mobile-menu a{
    display:block;
    padding:14px 24px;
    color:var(--muted);
    text-decoration:none;
    font-size:16px;
    font-weight:500;
    letter-spacing:.04em;
    border-bottom:1px solid rgba(120,110,255,.07);
    transition:color .2s, background .2s, padding-left .2s;
  }
  .mobile-menu a:last-child{ border-bottom:none; }
  .mobile-menu a:active{
    color:#fff;
    background:rgba(120,80,255,.12);
    padding-left:32px;
  }

  .actor-hero{
    position:relative;
    width:100%;
    min-height:640px;
    height:92vh;
    max-height:960px;
    overflow:hidden;
    background:#05060d;
    display:flex;
    align-items:flex-end;
  }

  .actor-hero-bg{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .actor-hero-bg img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 30%;
    display:block;
    transform:scale(1.06);
    will-change:transform;
    animation:heroBreath 22s ease-in-out infinite;
  }
  @keyframes heroBreath{
    0%,100%{ transform:scale(1.06); }
    50%    { transform:scale(1.12); }
  }

  .hero-glow{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    background:
      radial-gradient(ellipse 60% 55% at 30% 40%,
        rgba(160,80,255,.28) 0%,
        transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 70%,
        rgba(80,120,255,.22) 0%,
        transparent 65%);
    mix-blend-mode:screen;
    opacity:.75;
    animation:glowBreath 8s ease-in-out infinite;
  }
  @keyframes glowBreath{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%    { opacity:.95; transform:scale(1.08); }
  }

  .particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
  }
  .particle{
    position:absolute;
    width:2px; height:2px;
    border-radius:50%;
    background:radial-gradient(circle, #a04dff 0%, transparent 70%);
    opacity:.5;
    animation:floatUp linear infinite;
    will-change:transform, opacity;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.7; }
    90%{ opacity:.4; }
    100%{ transform:translateY(-110vh) translateX(40px); opacity:0; }
  }

  .actor-hero-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
    background:
      linear-gradient(to right,
        rgba(5,6,13,.92) 0%,
        rgba(5,6,13,.75) 22%,
        rgba(5,6,13,.25) 45%,
        rgba(5,6,13,0)   65%),
      linear-gradient(to bottom,
        rgba(5,6,13,0)   45%,
        rgba(5,6,13,.6)  78%,
        rgba(5,6,13,1)   100%);
  }

  .actor-hero-content{
    position:relative;
    z-index:3;
    width:100%;
    padding:calc(var(--header-h) + 40px) clamp(24px, 5vw, 80px) 80px;
    max-width:1480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .actor-kicker{
    font-family:'Manrope',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:#a99bff;
    opacity:.9;
    animation:fadeUp 1.1s .2s cubic-bezier(.2,.7,.3,1) both;
  }

  .actor-title{
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:clamp(38px, 6vw, 84px);
    line-height:1.02;
    letter-spacing:.005em;
    background:linear-gradient(180deg, #ffffff 0%, #c3cbff 60%, #9c7dff 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 40px rgba(90,70,255,.45));
    animation:fadeUp 1.1s .3s cubic-bezier(.2,.7,.3,1) both, shimmer 6s ease-in-out infinite 1.5s;
  }
  @keyframes shimmer{
    0%,100%{ background-position:0% 0; }
    50%    { background-position:100% 0; }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(24px); }
    to  { opacity:1; transform:translateY(0);    }
  }

  .actor-info{
    position:relative;
    z-index:3;
    padding:0 clamp(20px, 5vw, 80px) 100px;
    max-width:1480px;
    margin:0 auto;
  }

  .reveal{
    opacity:0;
    transform:translateY(34px);
    transition:opacity .9s cubic-bezier(.2,.7,.3,1), transform .9s cubic-bezier(.2,.7,.3,1);
  }
  .reveal.visible{
    opacity:1;
    transform:translateY(0);
  }

  .section-title{
    font-family:'Unbounded',sans-serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:.02em;
    margin-bottom:22px;
    color:var(--text);
    display:inline-flex;
    align-items:center;
    gap:14px;
    position:relative;
  }
  .section-title::after{
    content:'';
    width:44px;
    height:2px;
    background:linear-gradient(90deg, var(--violet), var(--blue));
    border-radius:2px;
    animation:lineGrow 2.5s ease-in-out infinite;
  }
  @keyframes lineGrow{
    0%,100%{ width:44px; opacity:.75; }
    50%    { width:70px; opacity:1;  }
  }

  .actor-bio{
    font-size:16px;
    line-height:1.72;
    color:#c8ccec;
    max-width:900px;
    margin-bottom:56px;
  }

  .filmography{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
    margin-bottom:56px;
  }
  .filmography.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:160px;
    border-radius:16px;
    background:rgba(20,22,45,.15);
    border:1px dashed rgba(120,110,255,.22);
    color:var(--muted);
    font-family:'Unbounded',sans-serif;
    font-size:14px;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  .film-item{
    display:block;
    text-decoration:none;
    color:inherit;
    border-radius:14px;
    overflow:hidden;
    background:rgba(20,22,45,.55);
    border:1px solid rgba(120,110,255,.12);
    transition:transform .3s cubic-bezier(.2,.7,.3,1),
               border-color .3s,
               box-shadow .3s;
  }
  .film-item:hover{
    transform:translateY(-5px);
    border-color:rgba(160,120,255,.7);
    box-shadow:0 16px 44px rgba(90,60,255,.4),
               0 0 30px rgba(140,90,255,.28);
  }
  .film-item-poster{
    width:100%;
    aspect-ratio:2/3;
    background:
      linear-gradient(135deg, rgba(60,40,120,.5), rgba(20,22,45,.9)),
      radial-gradient(circle at 30% 30%, rgba(120,80,255,.25), transparent 60%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .film-item-poster img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .film-item-title{
    padding:10px 12px;
    font-size:13px;
    font-weight:500;
    line-height:1.3;
    color:var(--text);
  }

  @media (max-width:1100px){
    header{ padding:0 20px; gap:16px; }
    nav.desktop-nav{ gap:16px; }
    nav.desktop-nav a{ font-size:14px; }
    .header-title{ font-size:14px; }
    .filmography{ grid-template-columns:repeat(3, 1fr); }
  }

  @media (max-width:900px){
    :root{ --header-h: 66px; }
    header{ padding:0 12px; gap:12px; }
    nav.desktop-nav{ display:none; }
    .burger{ display:block; }
    .mobile-menu{ display:block; }

    .close-btn{ width:40px; height:40px; }
    .close-btn svg{ width:20px; height:20px; }

    .header-title{
      font-size:13px;
      letter-spacing:.03em;
      max-width:50%;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actor-hero{
      min-height:520px;
      height:82vh;
    }
    .actor-hero-bg img{ object-position:60% center; }

    .actor-hero-overlay{
      background:
        linear-gradient(to right,
          rgba(5,6,13,.85) 0%,
          rgba(5,6,13,.55) 35%,
          rgba(5,6,13,.1) 65%,
          rgba(5,6,13,0) 100%),
        linear-gradient(to bottom,
          rgba(5,6,13,0) 30%,
          rgba(5,6,13,.55) 65%,
          rgba(5,6,13,1) 100%);
    }
    .actor-hero-content{
      padding:calc(var(--header-h) + 20px) 20px 48px;
      gap:12px;
    }
    .actor-title{ font-size:clamp(30px, 9vw, 52px); }
    .actor-kicker{ font-size:11px; letter-spacing:.2em; }

    .actor-info{ padding:0 20px 72px; }
    .actor-bio{ font-size:15px; margin-bottom:44px; }
    .section-title{ font-size:19px; margin-bottom:18px; }

    .filmography{ grid-template-columns:repeat(2, 1fr); gap:12px; }
  }

  @media (max-width:480px){
    :root{ --header-h: 60px; }
    header{ padding:0 10px; gap:10px; }

    .close-btn{ width:36px; height:36px; }
    .close-btn svg{ width:18px; height:18px; }
    .header-title{ font-size:11px; }

    .burger{ width:40px; height:40px; }
    .burger span{ left:9px; right:9px; }
    .burger span:nth-child(1){ top:13px; }
    .burger span:nth-child(2){ top:19px; }
    .burger span:nth-child(3){ top:25px; }
    .burger.open span:nth-child(1),
    .burger.open span:nth-child(3){ top:19px; }

    .actor-hero{ min-height:460px; height:80vh; }
    .actor-title{ font-size:clamp(26px, 9vw, 40px); }
    .actor-info{ padding:0 16px 60px; }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<header id="siteHeader">
  <a href="../team.html" class="close-btn" aria-label="Вернуться к команде">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round">
      <line x1="6" y1="6" x2="18" y2="18"/>
      <line x1="18" y1="6" x2="6" y2="18"/>
    </svg>
  </a>

  <div class="header-title">Ренат Фаухиев</div>

  <nav class="desktop-nav">
    <a href="../../index.html">Главная</a>
    <a href="../../watch.html">Смотреть</a>
    <a href="../team.html">Команда</a>
    <a href="../../announcements.html">Анонсы</a>
    <a href="../../biography.html">Биография</a>
  </nav>

  <button class="burger" id="burger" aria-label="Меню" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="../../index.html">Главная</a>
  <a href="../../watch.html">Смотреть</a>
  <a href="../team.html">Команда</a>
  <a href="../../announcements.html">Анонсы</a>
  <a href="../../biography.html">Биография</a>
</div>

<section class="actor-hero">
  <div class="actor-hero-bg" id="heroBg">
    <img src="Renat_Faukhiev.JPG" alt="Ренат Фаухиев">
  </div>
  <div class="hero-glow"></div>
  <div class="particles" id="particles"></div>
  <div class="actor-hero-overlay"></div>

  <div class="actor-hero-content">
    <div class="actor-kicker">Актёр</div>
    <h1 class="actor-title">Ренат Фаухиев</h1>
  </div>
</section>

<section class="actor-info">

  <h2 class="section-title reveal">О нём</h2>
  <p class="actor-bio reveal" id="bioBlock">
    Информация скоро появится.
  </p>

  <h2 class="section-title reveal">Фильмография</h2>
  <div class="filmography empty reveal" id="filmographyBlock">
    Скоро
  </div>

</section>

<script>
  const ACTOR = {
    name: 'Ренат Фаухиев',
    bio:  '',
    filmography: [
      {
        title:  'Красный кролик',
        link:   '../../Red_rabbit/Red_rabbit_film.html',
        poster: '../../Red_rabbit/Red_rabbit1.jpg'
      },
      {
        title:  'Красный кролик: Первая жертва',
        link:   '../../Red_rabbit_first_victim/Red_rabbit_first_victim_film.html',
        poster: '../../Red_rabbit_first_victim/Red_rabbit_first_victim1.jpg'
      },
      {
        title:  'Красный кролик: Грехи',
        link:   '../../Red_rabbit_sins/Red_rabbit_sins_film.html',
        poster: '../../Red_rabbit_sins/Red_rabbit_sins1.jpg'
      },
      {
        title:  'Красный кролик: Искупление',
        link:   '../../Red_rabbit_atonement/Red_rabbit_atonement_film.html',
        poster: '../../Red_rabbit_atonement/Red_rabbit_atonement1.jpg'
      },
      {
        title:  'Пыль',
        link:   '../../dust/dust_film.html',
        poster: '../../dust/dust1.jpg'
      }
    ]
  };

  if(ACTOR.bio && ACTOR.bio.trim()){
    document.getElementById('bioBlock').textContent = ACTOR.bio;
  }

  const filmographyBlock = document.getElementById('filmographyBlock');
  if(ACTOR.filmography && ACTOR.filmography.length > 0){
    filmographyBlock.classList.remove('empty');
    filmographyBlock.innerHTML = ACTOR.filmography.map(f => `
      <a href="${f.link}" class="film-item">
        <div class="film-item-poster">
          <img src="${f.poster}" alt="${f.title}">
        </div>
        <div class="film-item-title">${f.title}</div>
      </a>
    `).join('');
  }

  const burger      = document.getElementById('burger');
  const mobileMenu  = document.getElementById('mobileMenu');
  const siteHeader  = document.getElementById('siteHeader');

  window.addEventListener('scroll', () => {
    siteHeader.classList.toggle('scrolled', window.scrollY > 30);
  }, { passive:true });

  const heroBg = document.getElementById('heroBg');
  const isMobile = () => window.matchMedia('(max-width: 900px)').matches;
  if(heroBg && window.matchMedia('(prefers-reduced-motion: no-preference)').matches){
    let ticking = false;
    window.addEventListener('scroll', () => {
      if(!ticking){
        requestAnimationFrame(() => {
          const y = Math.min(window.scrollY, 700);
          const strength = isMobile() ? 0.5 : 0.3;
          heroBg.style.transform = 'translateY(' + (y * strength) + 'px)';
          ticking = false;
        });
        ticking = true;
      }
    }, { passive:true });
  }

  const particlesBox = document.getElementById('particles');
  if(particlesBox && window.matchMedia('(prefers-reduced-motion: no-preference)').matches){
    const count = window.innerWidth < 700 ? 22 : 26;
    for(let i = 0; i < count; i++){
      const p = document.createElement('span');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.bottom = (-10 - Math.random() * 20) + '%';
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      p.style.animationDelay = (-Math.random() * 20) + 's';
      const scale = 0.8 + Math.random() * 1.8;
      p.style.transform = 'scale(' + scale + ')';
      p.style.opacity = (0.3 + Math.random() * 0.55).toFixed(2);
      particlesBox.appendChild(p);
    }
  }

  const revealEls = document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if(en.isIntersecting){
          en.target.classList.add('visible');
          io.unobserve(en.target);
        }
      });
    }, { threshold:0.12, rootMargin:'0px 0px -40px 0px' });
    revealEls.forEach((el, i) => {
      el.style.transitionDelay = (i * 60) + 'ms';
      io.observe(el);
    });
  } else {
    revealEls.forEach(el => el.classList.add('visible'));
  }

  burger.addEventListener('click', () => {
    const open = burger.classList.toggle('open');
    mobileMenu.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      burger.classList.remove('open');
      mobileMenu.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    });
  });
</script>

</body>
</html>
