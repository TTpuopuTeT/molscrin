<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>МОЛСКРИН</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="prefetch" href="watch.html" as="document">
<link rel="prefetch" href="team.html" as="document">
<style>
  :root{
    --bg:      #05060d;
    --blue:    #4d7cff;
    --violet:  #a04dff;
    --text:    #e6e8ff;
    --muted:   #9aa0c8;
    --header-h: 86px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overflow-x:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ================= ШАПКА (flex, компактная) ================= */
  header{
    position:fixed;
    top:0; left:0; right:0;
    height:var(--header-h);
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:22px;
    padding:0 34px;
    background:rgba(8,10,22,.6);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(120,110,255,.12);
  }

  /* ================= ЛОГОТИП: ТЕКСТОВАЯ «М» ================= */
  .logo{
    display:flex;
    align-items:center;
    text-decoration:none;
    line-height:0;
    flex-shrink:0;
  }
  .logo-letter{
    display:flex;
    align-items:center;
    justify-content:center;
    width:54px;
    height:54px;
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:34px;
    line-height:1;
    letter-spacing:-.02em;
    background:linear-gradient(135deg, #a04dff 0%, #4d7cff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 10px rgba(110,80,255,.55));
    transition:filter .3s ease, transform .3s ease;
    user-select:none;
    -webkit-user-select:none;
  }
  .logo:hover .logo-letter{
    filter:drop-shadow(0 0 18px rgba(150,90,255,.95));
    transform:scale(1.05);
  }

  /* ================= СТРОКА ПОИСКА ================= */
  .search-wrap{
    position:relative;
    flex:0 1 460px;
    width:min(460px, 40vw);
    margin:0 auto;
    z-index:120;
  }
  .search{ position:relative; }
  .search input{
    width:100%;
    height:50px;
    border-radius:25px;
    padding:0 22px 0 50px;
    font-family:inherit;
    font-size:16px;
    color:var(--text);
    background:rgba(20,22,45,.85);
    border:1px solid rgba(120,110,255,.35);
    outline:none;
    transition:border-color .25s, box-shadow .25s, background .25s;
  }
  .search input::placeholder{ color:#6b72a3; }
  .search input:focus{
    background:rgba(24,26,52,.95);
    border-color:rgba(140,110,255,.85);
    box-shadow:0 0 0 3px rgba(120,80,255,.16), 0 0 28px rgba(90,60,255,.32);
  }
  .search .icon-search{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    width:17px; height:17px;
    opacity:.55;
    pointer-events:none;
  }

  /* ================= ВЫПАДАЮЩИЕ РЕЗУЛЬТАТЫ ================= */
  .search-results{
    position:absolute;
    top:calc(100% + 10px);
    left:0; right:0;
    max-height:min(70vh, 560px);
    overflow-y:auto;
    background:rgba(10,12,26,.97);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(120,110,255,.22);
    border-radius:18px;
    padding:14px;
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 40px rgba(90,60,255,.15);
  }
  .search-results.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .search-results::-webkit-scrollbar{ width:6px; }
  .search-results::-webkit-scrollbar-thumb{
    background:rgba(120,110,255,.3);
    border-radius:3px;
  }

  .results-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
  }

  .film-card{
    display:block;
    text-decoration:none;
    color:inherit;
    border-radius:12px;
    overflow:hidden;
    background:rgba(20,22,45,.6);
    border:1px solid rgba(120,110,255,.12);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    opacity:0;
    animation:cardIn .22s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(6px); }
    to  { opacity:1; transform:translateY(0);   }
  }

  .film-card.link:hover{
    transform:translateY(-2px);
    border-color:rgba(140,110,255,.6);
    box-shadow:0 8px 24px rgba(90,60,255,.25);
  }
  .film-card.disabled{
    cursor:not-allowed;
    opacity:.7;
  }

  .film-card-poster{
    position:relative;
    width:100%;
    aspect-ratio:2/3;
    background:
      linear-gradient(135deg, rgba(60,40,120,.5), rgba(20,22,45,.9)),
      radial-gradient(circle at 30% 30%, rgba(120,80,255,.25), transparent 60%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .film-card-poster img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .film-card-poster .soon{
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(180,170,255,.55);
    border:1px solid rgba(120,110,255,.3);
    padding:5px 10px;
    border-radius:20px;
  }

  .film-card-title{
    padding:10px 12px;
    font-size:13px;
    font-weight:500;
    line-height:1.3;
    color:var(--text);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .film-card.disabled .film-card-title{ color:var(--muted); }

  .no-results{
    padding:24px 12px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  /* ================= НАВИГАЦИЯ ================= */
  nav.desktop-nav{
    display:flex;
    align-items:center;
    gap:24px;
    flex-shrink:0;
  }
  nav.desktop-nav a{
    position:relative;
    color:var(--muted);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    letter-spacing:.04em;
    white-space:nowrap;
    transition:color .2s, text-shadow .2s;
  }
  nav.desktop-nav a::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-6px;
    height:1px;
    background:linear-gradient(90deg, var(--blue), var(--violet));
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .28s ease;
  }
  nav.desktop-nav a:hover{
    color:#fff;
    text-shadow:0 0 14px rgba(150,110,255,.9);
  }
  nav.desktop-nav a:hover::after{ transform:scaleX(1); }

  /* ================= БУРГЕР + МОБИЛЬНАЯ ЛУПА ================= */
  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }

  .mobile-search-btn{
    display:none;
    width:44px; height:44px;
    align-items:center;
    justify-content:center;
    background:rgba(20,22,45,.65);
    border:1px solid rgba(120,110,255,.22);
    border-radius:50%;
    color:var(--text);
    cursor:pointer;
    transition:background .2s, border-color .2s, color .2s;
  }
  .mobile-search-btn:hover,
  .mobile-search-btn.active{
    background:rgba(28,30,55,.85);
    border-color:rgba(140,110,255,.6);
    color:#fff;
  }
  .mobile-search-btn svg{
    width:18px; height:18px;
    stroke:currentColor;
    stroke-width:2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .burger{
    display:none;
    width:44px; height:44px;
    background:transparent;
    border:none;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
  }
  .burger span{
    position:absolute;
    left:10px; right:10px;
    height:2px;
    background:var(--text);
    border-radius:2px;
    transition:transform .3s ease, opacity .3s ease, top .3s ease;
  }
  .burger span:nth-child(1){ top:15px; }
  .burger span:nth-child(2){ top:21px; }
  .burger span:nth-child(3){ top:27px; }

  .burger.open span:nth-child(1){ top:21px; transform:rotate(45deg); }
  .burger.open span:nth-child(2){ opacity:0; }
  .burger.open span:nth-child(3){ top:21px; transform:rotate(-45deg); }

  /* ================= МОБИЛЬНОЕ МЕНЮ ================= */
  .mobile-menu{
    display:none;
    position:fixed;
    top:var(--header-h);
    left:0; right:0;
    z-index:99;
    background:rgba(8,10,22,.96);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(120,110,255,.18);
    padding:8px 0 16px;
    transform:translateY(-8px);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  .mobile-menu.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .mobile-menu a{
    display:block;
    padding:14px 24px;
    color:var(--muted);
    text-decoration:none;
    font-size:16px;
    font-weight:500;
    letter-spacing:.04em;
    border-bottom:1px solid rgba(120,110,255,.07);
    transition:color .2s, background .2s;
  }
  .mobile-menu a:last-child{ border-bottom:none; }
  .mobile-menu a:active{
    color:#fff;
    background:rgba(120,80,255,.12);
  }

  /* ================= ГЛАВНЫЙ ЭКРАН ================= */
  .hero{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ====== ФОН: КАК В ИСХОДНИКЕ, НЕ ТРОГАЕМ ====== */
  .columns{
    position:absolute;
    inset:0;
    display:flex;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-mask-image:linear-gradient(to bottom,
        transparent 0%, #000 16%, #000 84%, transparent 100%);
    mask-image:linear-gradient(to bottom,
        transparent 0%, #000 16%, #000 84%, transparent 100%);
    contain:strict;
  }

  .column{
    flex:1 1 0;
    overflow:hidden;
    position:relative;
    contain:layout paint;
  }

  .column-track{
    display:flex;
    flex-direction:column;
    transform:translate3d(0,0,0);
    animation-name:revolve;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }

  .columns.paused .column-track{
    animation-play-state:paused;
  }

  @keyframes revolve{
    from{ transform:translate3d(0,-50%,0); }
    to  { transform:translate3d(0,0,0);    }
  }

  .column-track span{
    display:block;
    padding:13px 12px;
    font-size:15px;
    font-weight:500;
    line-height:1.35;
    letter-spacing:.01em;
    text-align:center;
    color:rgba(160,170,235,.60);
  }

  .hero-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 55% at 50% 50%,
        rgba(5,6,13,.30) 0%,
        rgba(5,6,13,.80) 55%,
        rgba(5,6,13,.97) 100%),
      linear-gradient(to bottom,
        rgba(5,6,13,.92) 0%,
        rgba(5,6,13,.15) 28%,
        rgba(5,6,13,.15) 72%,
        rgba(5,6,13,.95) 100%);
  }

  .hero-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:calc(var(--header-h) + 12px) 20px 20px;
  }

  .studio{
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:clamp(42px, 9vw, 138px);
    letter-spacing:.06em;
    line-height:1;
    white-space:nowrap;
    background:linear-gradient(180deg,
      #ffffff 0%,
      #c3cbff 42%,
      #7a5cff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 44px rgba(90,70,255,.5));
    animation:fadeUp 1.3s cubic-bezier(.2,.7,.3,1) both;
  }

  .hero-desc{
    margin-top:38px;
    width:min(780px, 92%);
    min-height:64px;
    font-family:'Inter',sans-serif;
    font-size:17px;
    font-weight:500;
    line-height:1.55;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-align:center;
    background:linear-gradient(180deg,
      #ffffff 0%,
      #d6dcff 40%,
      #a98bff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 26px rgba(120,80,255,.45));
    animation:fadeUp 1.3s .35s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(22px); }
    to  { opacity:1; transform:translateY(0);    }
  }

  /* ================= ПЛАНШЕТ ================= */
  @media (max-width:1100px){
    header{ padding:0 20px; gap:16px; }
    nav.desktop-nav{ gap:16px; }
    nav.desktop-nav a{ font-size:14px; }
    .logo-letter{ width:46px; height:46px; font-size:29px; }
    .search-wrap{ flex:0 1 380px; width:min(380px, 36vw); }
    .hero-desc{ font-size:15px; letter-spacing:.07em; }
  }

  /* ================= МОБИЛЬНЫЙ ================= */
  @media (max-width:900px){
    :root{ --header-h: 66px; }

    header{
      gap:10px;
      padding:0 14px;
    }

    nav.desktop-nav{ display:none; }
    .burger{ display:block; }
    .mobile-menu{ display:block; }
    .mobile-search-btn{ display:inline-flex; }

    .logo-letter{ width:40px; height:40px; font-size:25px; }

    .search-wrap{
      position:fixed;
      top:var(--header-h);
      left:0;
      right:0;
      width:100%;
      flex:none;
      margin:0;
      padding:10px 14px;
      background:rgba(8,10,22,.97);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(120,110,255,.18);
      z-index:98;
      opacity:0;
      transform:translateY(-10px);
      pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
    }
    .search-wrap.mobile-open{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }
    .search input{
      height:44px;
      border-radius:22px;
      padding:0 18px 0 46px;
      font-size:16px;
    }
    .search .icon-search{
      left:16px;
      width:16px; height:16px;
    }

    .search-results{
      position:absolute;
      top:calc(100% + 8px);
      left:0; right:0;
      max-height:calc(100vh - var(--header-h) - 80px);
    }

    .results-grid{
      grid-template-columns:repeat(2, 1fr);
      gap:10px;
    }

    .film-card-title{ font-size:12px; padding:8px 10px; }

    .column-track span{
      font-size:13px;
      padding:11px 6px;
      line-height:1.3;
    }

    .hero-content{
      padding:calc(var(--header-h) + 8px) 12px 16px;
    }

    .studio{
      font-size:clamp(28px, 9.5vw, 56px);
      letter-spacing:.03em;
      white-space:nowrap;
    }

    .hero-desc{
      margin-top:24px;
      min-height:40px;
      font-size:11px;
      line-height:1.5;
      letter-spacing:.04em;
    }
  }

  /* ================= УЗКИЙ ТЕЛЕФОН ================= */
  @media (max-width:480px){
    :root{ --header-h: 60px; }

    header{ padding:0 12px; gap:8px; }

    .logo-letter{ width:36px; height:36px; font-size:22px; }

    .mobile-search-btn{ width:40px; height:40px; }

    .search input{
      height:42px;
      border-radius:21px;
      padding:0 16px 0 42px;
    }
    .search .icon-search{
      left:14px;
      width:15px; height:15px;
    }

    .column-track span{
      font-size:12px;
      padding:10px 4px;
    }

    .hero-content{
      padding:calc(var(--header-h) + 6px) 10px 14px;
    }

    .studio{
      font-size:clamp(24px, 9vw, 42px);
      letter-spacing:.02em;
    }

    .hero-desc{
      font-size:9px;
      margin-top:18px;
      line-height:1.45;
      letter-spacing:.03em;
    }

    .burger{ width:40px; height:40px; }
    .burger span{ left:9px; right:9px; }
    .burger span:nth-child(1){ top:13px; }
    .burger span:nth-child(2){ top:19px; }
    .burger span:nth-child(3){ top:25px; }
    .burger.open span:nth-child(1),
    .burger.open span:nth-child(3){ top:19px; }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<header>

  <a href="index.html" class="logo" aria-label="МОЛСКРИН">
    <span class="logo-letter">М</span>

      <div class="results-grid" id="resultsGrid"></div>

  <nav class="desktop-nav">
    <a href="index.html">Главная</a>
    <a href="watch.html">Смотреть</a>

</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Главная</a>
  <a href="watch.html">Смотреть</a>

  <a href="announcements.html">Анонсы</a>

</div>

<main class="hero">

  <div class="columns" id="columns"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">

    </div>
  </div>

</main>

<script>
  const TITLES = [
    'Раскол','Весна','Северный ветер','Элли','Изумрудный город',
    'Я больше не буду плакать','Красный кролик','Красный кролик: Первая жертва',
    'Красный кролик: Грехи','Красный кролик: Искупление','Око за око',
    'Нашедший','Нашедший: Принятие','Наказание','Первый ход',
    'Scappa de casa','Не улетай','Пыль','Помощь','Любовь',
    'Страницы усталости','Mors certa, vita incerta','Последний глоток'
  ];

  const FILM_DATA = {
    'Раскол':                        { link: 'Split/Split_film.html', poster: 'Split/Split.jpg' },
    'Весна':                         { link: 'Spring/Spring_film.html', poster: 'Spring/Spring.jpg' },
    'Северный ветер':                { link: 'North_wind/North_wind_film.html', poster: 'North_wind/North_wind1.jpg' },
    'Элли':                          { link: 'Ellie/Ellie_film.html', poster: 'Ellie/Ellie.jpg' },
    'Изумрудный город':              { link: 'The_emerald_city/The_emerald_city_film.html', poster: 'The_emerald_city/The_emerald_city1.jpg' },
    'Я больше не буду плакать':      { link: 'I_wont_cry_anymore/I_wont_cry_anymore_film.html', poster: 'I_wont_cry_anymore/I_wont_cry_anymore1.jpg' },
    'Красный кролик':                { link: 'Red_rabbit/Red_rabbit_film.html', poster: 'Red_rabbit/Red_rabbit1.jpg' },
    'Красный кролик: Первая жертва': { link: 'Red_rabbit_first_victim/Red_rabbit_first_victim_film.html', poster: 'Red_rabbit_first_victim/Red_rabbit_first_victim1.jpg' },
    'Красный кролик: Грехи':         { link: 'Red_rabbit_sins/Red_rabbit_sins_film.html', poster: 'Red_rabbit_sins/Red_rabbit_sins1.jpg' },
    'Красный кролик: Искупление':    { link: 'Red_rabbit_atonement/Red_rabbit_atonement_film.html', poster: 'Red_rabbit_atonement/Red_rabbit_atonement1.jpg' },
    'Око за око':                    { link: 'An_eye_for_an_eye/An_eye_for_an_eye_film.html', poster: 'An_eye_for_an_eye/An_eye_for_an_eye.jpg' },
    'Нашедший':                      { link: 'The_finder/The_finder_film.html', poster: 'The_finder/The_finder1.jpg' },
    'Нашедший: Принятие':            { link: 'Finder_acceptance/Finder_acceptance_film.html', poster: 'Finder_acceptance/Finder_acceptance1.jpg' },
    'Наказание':                     { link: 'Punishment/Punishment_film.html', poster: 'Punishment/Punishment1.jpg' },
    'Первый ход':                    { link: 'the_first_move/the_first_move_film.html', poster: 'the_first_move/the_first_move1.jpg' },
    'Scappa de casa':                { link: 'Scappa_de_casa/Scappa_de_casa_film.html', poster: 'Scappa_de_casa/Scappa_de_casa1.jpg' },
    'Не улетай':                     { link: 'Dont_fly_away/Dont_fly_away_film.html', poster: 'Dont_fly_away/Dont_fly_away1.jpg' },
    'Пыль':                          { link: 'dust/dust_film.html', poster: 'dust/dust1.jpg' },
    'Помощь':                        { link: 'help/help_film.html', poster: 'help/help1.jpg' },
    'Любовь':                        { link: 'love/love_film.html', poster: 'love/love1.jpg' },
    'Страницы усталости':            { link: 'Pages_of_fatigue/Pages_of_fatigue_film.html', poster: 'Pages_of_fatigue/Pages_of_fatigue1.jpg' },
    'Mors certa, vita incerta':      { link: 'mors_certa/mors_certa_film.html', poster: 'mors_certa/mors_certa1.jpg' },
    'Последний глоток':              { link: 'the_last_sip/the_last_sip_film.html', poster: 'the_last_sip/the_last_sip1.jpg' }
  };

  const columnsEl       = document.getElementById('columns');
  const burger          = document.getElementById('burger');
  const mobileMenu      = document.getElementById('mobileMenu');
  const searchInput     = document.getElementById('searchInput');
  const resultsBox      = document.getElementById('searchResults');
  const resultsGrid     = document.getElementById('resultsGrid');
  const searchWrap      = document.getElementById('searchWrap');
  const mobileSearchBtn = document.getElementById('mobileSearchBtn');

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function columnCount(){
    const w = window.innerWidth;
    const weak = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
                 (navigator.deviceMemory && navigator.deviceMemory <= 4);
    if (w < 480)  return 2;
    if (w < 700)  return weak ? 2 : 3;
    if (w < 1100) return weak ? 3 : 4;
    if (w < 1600) return weak ? 4 : 5;
    return weak ? 4 : 6;
  }

  const TITLES_PER_COLUMN = 12;
  let currentColumnCount = 0;

  function buildColumns(){
    const count = columnCount();
    currentColumnCount = count;
    columnsEl.innerHTML = '';

    for(let i = 0; i < count; i++){
      const col   = document.createElement('div');
      col.className = 'column';

      const track = document.createElement('div');
      track.className = 'column-track';

      const seq = shuffle([...TITLES]).slice(0, TITLES_PER_COLUMN);
      seq.concat(seq).forEach(title => {
        const s = document.createElement('span');
        s.textContent = title;
        track.appendChild(s);
      });

      const dur = 28 + Math.random() * 24;
      track.style.animationDuration = dur + 's';
      track.style.animationDelay    = (-Math.random() * dur) + 's';

      col.appendChild(track);
      columnsEl.appendChild(col);
    }
  }

  buildColumns();

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function openResults(){ resultsBox.classList.add('open'); }
  function closeResults(){ resultsBox.classList.remove('open'); }

  function renderResults(query){
    const q = query.trim().toLowerCase();

    if(!q){
      closeResults();
      resultsGrid.innerHTML = '';
      return;
    }

    const matches = TITLES.filter(t => t.toLowerCase().includes(q));

    if(matches.length === 0){
      resultsGrid.innerHTML = '<div class="no-results">Ничего не найдено</div>';
      openResults();
      return;
    }

    resultsGrid.innerHTML = matches.map((title, i) => {
      const data = FILM_DATA[title];

      if(data){
        return `
          <a href="${data.link}" class="film-card link" style="animation-delay:${Math.min(i * 18, 180)}ms">
            <div class="film-card-poster">
              <img src="${data.poster}" alt="${escapeHtml(title)}" loading="lazy"
                   onerror="this.style.display='none'; this.parentNode.insertAdjacentHTML('beforeend','<span class=&quot;soon&quot;>СКОРО</span>')">
            </div>
            <div class="film-card-title">${escapeHtml(title)}</div>
          </a>
        `;
      }

      return `
        <div class="film-card disabled" style="animation-delay:${Math.min(i * 18, 180)}ms">
          <div class="film-card-poster">
            <span class="soon">Скоро</span>
          </div>
          <div class="film-card-title">${escapeHtml(title)}</div>
        </div>
      `;
    }).join('');

    openResults();
  }

  function renderRandom(){
    const keys = shuffle([...TITLES]).filter(t => FILM_DATA[t]).slice(0, 6);

    if(keys.length === 0){
      closeResults();
      resultsGrid.innerHTML = '';
      return;
    }

    resultsGrid.innerHTML = keys.map((title, i) => {
      const data = FILM_DATA[title];
      return `
        <a href="${data.link}" class="film-card link" style="animation-delay:${Math.min(i * 18, 180)}ms">
          <div class="film-card-poster">
            <img src="${data.poster}" alt="${escapeHtml(title)}" loading="lazy"
                 onerror="this.style.display='none'; this.parentNode.insertAdjacentHTML('beforeend','<span class=&quot;soon&quot;>СКОРО</span>')">
          </div>
          <div class="film-card-title">${escapeHtml(title)}</div>
        </a>
      `;
    }).join('');

    openResults();
  }

  searchInput.addEventListener('input', e => {
    const v = e.target.value;
    if(v.trim()) renderResults(v);
    else if(document.activeElement === searchInput) renderRandom();
    else { closeResults(); resultsGrid.innerHTML = ''; }
  });

  searchInput.addEventListener('focus', e => {
    if(e.target.value.trim()) renderResults(e.target.value);
    else renderRandom();
  });

  document.addEventListener('click', e => {
    if(!e.target.closest('.search-wrap')) closeResults();
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      closeResults();
      searchInput.blur();
      closeMobileSearch();
    }
  });

  function openMobileSearch(){
    searchWrap.classList.add('mobile-open');
    mobileSearchBtn.classList.add('active');
    mobileSearchBtn.setAttribute('aria-expanded', 'true');
    setTimeout(() => searchInput.focus(), 120);
  }
  function closeMobileSearch(){
    searchWrap.classList.remove('mobile-open');
    mobileSearchBtn.classList.remove('active');
    mobileSearchBtn.setAttribute('aria-expanded', 'false');
  }

  mobileSearchBtn.addEventListener('click', e => {
    e.stopPropagation();
    if(searchWrap.classList.contains('mobile-open')){
      closeMobileSearch();
      closeResults();
    } else {
      openMobileSearch();
    }
  });

  burger.addEventListener('click', () => {
    const open = burger.classList.toggle('open');
    mobileMenu.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) closeMobileSearch();
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      burger.classList.remove('open');
      mobileMenu.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    });
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if(columnCount() !== currentColumnCount) buildColumns();
    }, 250);
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if(columnCount() !== currentColumnCount) buildColumns();
    }, 300);
  });

  document.addEventListener('visibilitychange', () => {
    columnsEl.classList.toggle('paused', document.hidden);
  });
</script>

</body>
</html>
